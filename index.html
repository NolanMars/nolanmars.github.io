<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Style Arborescence</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            text-align: left;
            padding: 20px;
        }
        ul {
            list-style-type: none;
            padding-left: 20px;
        }
        li {
            cursor: pointer;
            position: relative;
        }
        li::before {
            content: '▸'; /* Flèche fermée */
            position: absolute;
            left: -20px;
            color: lime;
        }
        li.open::before {
            content: '▾'; /* Flèche ouverte */
        }
        .submenu {
            display: none;
        }
        li.open > .submenu {
            display: block;
        }
    </style>
    <script>
        function toggleMenu(event) {
            const listItem = event.target;
            if (listItem.classList.contains('menu-item')) {
                listItem.classList.toggle('open');
            }
        }
    </script>
</head>
<body>
    <h1 style="color: lime;">Menu Arborescence</h1>
    <ul onclick="toggleMenu(event)">
        <li class="menu-item">News</li>
        <li class="menu-item">Chiptunes
            <ul class="submenu">
                <li>AY-3</li>
                <li>Arkos Tracker</li>
            </ul>
        </li>
        <li class="menu-item">GFX</li>
        <li class="menu-item">Code</li>
    </ul>
</body>
</html>
