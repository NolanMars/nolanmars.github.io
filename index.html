<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site avec Menu Fixe et Chargement AJAX</title>
    <style>
        @font-face {
            font-family: 'Pixel';
            src: url('fonts/Pixel.ttf') format('truetype');
        }
        body {
            font-family: 'Pixel', sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            position: fixed; /* Menu fixe */
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }
        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
        }
        nav ul li {
            margin: 0 25px; /* Espacement entre les rubriques */
            position: relative;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
            transition: color 0.3s;
            font-size: 20px; /* Taille de la police */
        }
        nav ul li a:hover {
            color: #f4a261;
        }
        nav ul li ul {
            list-style: none;
            padding: 10px 15px; /* Ajout de padding pour agrandir les rectangles */
            margin: 0;
            position: center;
            top: 100%;
            left: 0;
            background-color: #333;
            display: none;
            min-width: 180px; /* Largeur minimale pour agrandir les rectangles */
            border: 1px solid #f4a261; /* Ajout d'une bordure pour une meilleure visibilité */
        }
        nav ul li:hover ul {
            display: block;
        }
        nav ul li ul li {
            margin: 8px 0; /* Espacement vertical plus large entre les sous-rubriques */
        }
        nav ul li ul li a {
            color: white;
            text-decoration: none;
            font-size: 18px; /* Taille des sous-rubriques */
        }
        nav ul li ul li a:hover {
            color: #f4a261;
        }
        main {
            margin-top: 80px; /* Laisse un espace sous le menu */
            padding: 20px;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#" onclick="loadContent('news.html')">News</a></li>
                <li>
                    <a href="#">Chiptunes</a>
                    <ul>
                        <li><a href="#" onclick="loadContent('creations.html')">Créations</a></li>
                        <li><a href="#" onclick="loadContent('arkos.html')">Arkos Tracker</a></li>
                        <li><a href="#" onclick="loadContent('docs.html')">Docs</a></li>
                    </ul>
                </li>
                <li><a href="#" onclick="loadContent('code.html')">Code</a></li>
                <li><a href="#" onclick="loadContent('gfx.html')">GFX</a></li>
            </ul>
        </nav>
    </header>
    <main id="content">
        <h2>Bienvenue sur mon site</h2>
        <p>Contenu principal ici...</p>
    </main>

    <script>
        function loadContent(page) {
            // Utilise l'API Fetch pour charger dynamiquement le contenu
            fetch(page)
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Erreur lors du chargement de la page : " + page);
                    }
                    return response.text();
                })
                .then(data => {
                    document.getElementById('content').innerHTML = data;
                })
                .catch(error => {
                    document.getElementById('content').innerHTML = `<p style="color:red;">${error.message}</p>`;
                });
        }
    </script>
</body>
</html>
