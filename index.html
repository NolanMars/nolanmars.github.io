<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Index 8bits/16bits</title>
  <style>
    body {
      background-color: black;
      color: limegreen;
      font-family: 'Press Start 2P', cursive;
      text-align: center;
    }
    header {
      background-color: #333;
      padding: 20px;

    nav {
      margin: 20px 0;

    nav a {
      color: limegreen;
      text-decoration: none;
      font-size: 16px;
      margin: 0 15px;

    nav a:hover {

    }
    .container {
      border: 2px solid limegreen;
      padding: 10px;
      display: inline-block;
      margin-top: 20px;
    }
  </style>

<body>
  <header>
    <h1>Bienvenue dans le Monde 8bits</h1>

  <nav>
    <a href="#news">News</a>
    <a href="#chiptunes">Chiptunes</a>
  </nav>
  <div class="container" id="news">
    <h2>News</h2>
    <p>Retrouvez les dernières nouveautés du monde retro-gaming ici.</p>
  </div>
  <div class="container" id="chiptunes">
    <h2>Chiptunes</h2>
    <p>Découvrez une collection de musiques Chiptunes à écouter.</p>
  </div>
