<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Index Style 16 bits</title>
  <style>
    body {
      background: linear-gradient(to bottom, #4c66a4, #1e2b56);
      color: #fdfdfd;
      font-family: 'Press Start 2P', cursive;
      text-align: center;
    }
    header {
      background: #3b4371;
      border-bottom: 4px solid #272b43;
      padding: 15px;
    }
    header h1 {
      font-size: 28px;
      color: #f7e851;
      text-shadow: 2px 2px #000;
    }
    nav {
      margin: 20px 0;
    }
    nav a {
      color: #fdfdfd;
      background: #454d77;
      text-decoration: none;
      font-size: 18px;
      padding: 10px 20px;
      margin: 0 10px;
      border: 2px solid #272b43;
      display: inline-block;
      border-radius: 5px;
      transition: all 0.2s;
    }
    nav a:hover {
      background: #f7e851;
      color: #000;
    }
    .container {
      border: 4px solid #3b4371;
      background: #5a678f;
      padding: 20px;
      margin: 20px auto;
      border-radius: 8px;
      width: 80%;
      max-width: 600px;
      color: #fff;
      box-shadow: 4px 4px #272b43;
    }
    h2 {
      text-shadow: 2px 2px #000;
    }
    p {
      font-size: 16px;
      line-height: 1.6;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <h1>Mode 16 bits</h1>
  </header>
  <nav>
    <a href="#news">News</a>
    <a href="#chiptunes">Chiptunes</a>
  </nav>
  <div class="container" id="news">
    <h2>News</h2>
    <p>Plongez dans le monde des dernières nouvelles rétro.</p>
  </div>
  <div class="container" id="chiptunes">
    <h2>Chiptunes</h2>
    <p>Écoutez des musiques qui rappellent vos souvenirs d'antan.</p>
  </div>
</body>
</html>
