<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site avec Menu Fixe et Chargement AJAX</title>
    <style>
        @font-face {
            font-family: 'Pixel';
            src: url('fonts/Pixel.ttf') format('truetype');
        }
        body {
            font-family: 'Pixel', sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            position: fixed; /* Menu fixe */
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }
        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
        }
        nav ul li {
            margin: 0 35px; /* Espacement entre les rubriques */
            position: relative;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
            transition: color 0.3s;
            font-size: 20px; /* Taille de la police */
        }
        nav ul li a:hover {
            color: #f4a261;
        }
        nav ul li ul {
            list-style: none;
            padding: 5px 10px; /* Réduit l'espace interne */
            margin: 0;
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #333;
            display: none;
            min-width: 140px; /* Réduit la largeur minimale */
            border: 1px solid #f4a261;
        }
        nav ul li:hover ul {
            display: block;
        }
        nav ul li ul li {
            margin: 5px 0; /* Espacement vertical entre les sous-rubriques */
        }
        nav ul li ul li a {
            color: white;
            text-decoration: none;
            font-size: 16px; /* Taille légèrement réduite pour les sous-rubriques */
        }
        nav ul li ul li a:hover {
            color: #f4a261;
        }
        main {
            margin-top: 80px; /* Laisse un espace sous le menu */
            padding: 20px;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#" onclick="loadContent('news.html')">News</a></li>
                <li>
                    <a href="#">Chiptunes</a>
                    <ul>
                        <li><a href="#" onclick="loadContent('amstradcpc.html')">Amstrad CPC</a></li>
                        <li><a href="#" onclick="loadContent('atarist.html')">Atari ST</a></li>
                        <li><a href="#" onclick="loadContent('c64.html')">C64</a></li>
                    </ul>
                </li>
                <li>
                    <a href="#">Arkos Tracker</a>
                    <ul>
                        <li><a href="#" onclick="loadContent('docsAK.html')">Docs</a></li>
                        <li><a href="#" onclick="loadContent('code.html')">Code</a></li>
                    </ul>
                </li>
                <li><a href="#" onclick="loadContent('gfx.html')">GFX</a></li>
            </ul>
        </nav>
    </header>
    <main id="content">
        <h2>Bienvenue sur mon site</h2>
        <p>Contenu principal ici...</p>
    </main>

    <script>
        function loadContent(page) {
            // Utilise l'API Fetch pour charger dynamiquement le contenu
            document.getElementById('content').innerHTML = '<p>Chargement en cours…</p>';
            fetch(page)
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Erreur lors du chargement de la page : " + page);
                    }
                    return response.text();
                })
                .then(data => {
                    document.getElementById('content').innerHTML = data;
                })
                .catch(error => {
                    document.getElementById('content').innerHTML = `
                        <p style="color:red;">${error.message}</p>
                        <button onclick="loadContent('${page}')">Réessayer</button>
                    `;
                });
        }
    </script>
</body>
</html>
