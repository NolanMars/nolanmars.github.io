<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu fixe</title>
    <style>
        @font-face {
            font-family: 'Pixel';
            src: url('fonts/Pixel.ttf') format('truetype');
        }
        body {
            font-family: 'Pixel', sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            position: fixed; /* Fixe le menu en haut */
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
        }
        nav ul li {
            position: relative;
            margin: 0 15px;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
            transition: color 0.3s;
        }
        nav ul li a:hover {
            color: #f4a261;
        }
        nav ul li ul {
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #333;
            padding: 10px;
            list-style: none;
            margin: 0;
            display: none;
        }
        nav ul li:hover ul {
            display: block;
        }
        nav ul li ul li {
            margin: 5px 0;
        }
        nav ul li ul li a {
            color: white;
            text-decoration: none;
        }
        nav ul li ul li a:hover {
            color: #f4a261;
        }
        main {
            margin-top: 80px; /* Ajout pour ne pas que le contenu chevauche le menu */
            padding: 20px;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="news.html">News</a></li>
                <li>
                    <a href="#chiptunes">Chiptunes</a>
                    <ul>
                        <li><a href="#creations">Créations</a></li>
                        <li><a href="#arkos">Arkos Tracker</a></li>
                        <li><a href="#docs">Docs</a></li>
                    </ul>
                </li>
                <li><a href="#code">Code</a></li>
                <li><a href="#gfx">GFX</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Bienvenue sur mon site</h2>
        <p>Contenu principal ici...</p>
    </main>
</body>
</html>
