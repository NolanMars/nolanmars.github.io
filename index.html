<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index Retro 16-Bits</title>
    <style>
        body {
            background-color: black;
            color: lime;
            font-family: 'Press Start 2P', cursive;
            font-size: 14px;
            text-align: center;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            cursor: pointer;
            padding: 5px;
            background-color: darkgreen;
            border: 2px solid lime;
            margin-bottom: 5px;
        }
        li:hover {
            background-color: lime;
            color: darkgreen;
        }
        .submenu {
            display: none;
        }
        .menu-item:hover .submenu {
            display: block;
        }
    </style>
</head>
<body>
    <h1>Bienvenue dans le Monde 16-Bits</h1>
    <ul>
        <li class="menu-item">News</li>
        <li class="menu-item">Chiptunes
            <ul class="submenu">
                <li>AY-3</li>
                <li>Arkos Tracker</li>
            </ul>
        </li>
        <li class="menu-item">GFX</li>
        <li class="menu-item">Code</li>
    </ul>
</body>
</html>
